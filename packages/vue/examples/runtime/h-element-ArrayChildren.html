<script>
  const { h } = Vue
  // h函数执行4次，先执行数组里的h(p, p1)，最后执行h(div, ...)

    class: 'test'
  }, [
    h('p', 'p1'),
    h('p', 'p2'),
    h('p', 'p3')
  ])

  console.log(vnode);
