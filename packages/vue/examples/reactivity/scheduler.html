<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="../../dist/vue.js"></script>
</head>

<body>
</body>
<script>
  const { reactive, effect } = Vue

  const obj = reactive({
    count: 1
  })

  // 调用 effect 方法
  // 1
  // 代码结束
  // 2
  // * triggerEffect 如果effect有调度器则执行调度器，否则执行run
  effect(() => {
    console.log(obj.count, 'inner');
  }, {
    scheduler() {
      setTimeout(() => {
        console.log(obj.count, 'outer');
      })
    }
  })


  obj.count = 2

  console.log('代码结束');

</script>


</html>
